<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Management Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 150, 0.08) 25%, rgba(0, 255, 150, 0.08) 26%, transparent 27%, transparent 74%, rgba(0, 255, 150, 0.08) 75%, rgba(0, 255, 150, 0.08) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 150, 0.08) 25%, rgba(0, 255, 150, 0.08) 26%, transparent 27%, transparent 74%, rgba(0, 255, 150, 0.08) 75%, rgba(0, 255, 150, 0.08) 76%, transparent 77%, transparent);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 255, 150, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
        }

        .navbar {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 18px;
            font-weight: 700;
            color: #00ff96;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dashboard-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        /* Top Info Banner for Date & Functional Week Selector */
        .header-info-card {
            background: rgba(20, 25, 50, 0.8);
            border: 1px solid rgba(0, 255, 150, 0.2);
            border-radius: 8px;
            padding: 1.25rem 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .header-info-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .header-info-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0a0;
        }

        .header-info-value {
            font-size: 20px;
            font-weight: 700;
            color: #00ff96;
        }

        .header-info-select {
            background: rgba(0, 255, 150, 0.1);
            border: 1px solid rgba(0, 255, 150, 0.4);
            border-radius: 4px;
            color: #00ff96;
            font-size: 18px;
            font-weight: 700;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }

        .header-info-select:hover,
        .header-info-select:focus {
            border-color: #00ff96;
            box-shadow: 0 0 12px rgba(0, 255, 150, 0.3);
        }

        .header-info-select option {
            background: #0a0e27;
            color: #00ff96;
            font-size: 14px;
        }

        .card {
            background: rgba(20, 25, 50, 0.8);
            border: 1px solid rgba(0, 255, 150, 0.2);
            border-radius: 8px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
            padding-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .filters {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .select-input {
            padding: 0.6rem 1rem;
            background: rgba(0, 255, 150, 0.1);
            border: 1px solid rgba(0, 255, 150, 0.3);
            border-radius: 4px;
            color: #00ff96;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .select-input:hover,
        .select-input:focus {
            border-color: #00ff96;
            box-shadow: 0 0 10px rgba(0, 255, 150, 0.2);
            outline: none;
        }

        .select-input option {
            background: #0a0e27;
            color: #00ff96;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            background: linear-gradient(135deg, #00ff96, #00cc7a);
            border: none;
            color: #0a0e27;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(0, 255, 150, 0.5);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid rgba(0, 255, 150, 0.4);
            color: #00ff96;
        }

        .btn-reset:hover {
            background: rgba(0, 255, 150, 0.15);
            box-shadow: 0 0 10px rgba(0, 255, 150, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: rgba(0, 255, 150, 0.05);
            border: 1px solid rgba(0, 255, 150, 0.2);
            padding: 1.5rem;
            border-radius: 6px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #00ff96;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0a0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: rgba(0, 255, 150, 0.05);
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 700;
            color: #00ff96;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
        }

        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(0, 255, 150, 0.1);
            color: #a0a0a0;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: rgba(0, 255, 150, 0.05);
        }

        .status-select {
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .status-done {
            background: rgba(0, 255, 150, 0.2);
            color: #00ff96;
            border: 1px solid rgba(0, 255, 150, 0.5);
        }

        .status-notdone {
            background: rgba(255, 180, 0, 0.2);
            color: #ffb400;
            border: 1px solid rgba(255, 180, 0, 0.5);
        }

        .status-select option {
            background: #0a0e27;
            color: #e0e0e0;
        }

        .remarks-input {
            width: 100%;
            background: rgba(0, 255, 150, 0.03);
            border: 1px solid rgba(0, 255, 150, 0.2);
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            color: #e0e0e0;
            font-size: 12px;
            outline: none;
            transition: all 0.3s;
        }

        .remarks-input:focus {
            border-color: #00ff96;
            background: rgba(0, 255, 150, 0.08);
            box-shadow: 0 0 8px rgba(0, 255, 150, 0.2);
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 255, 150, 0.1);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .pagination-info {
            font-size: 12px;
            color: #a0a0a0;
        }

        .pagination-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-left: auto;
        }

        .empty-state, .loading {
            text-align: center;
            padding: 3rem;
            color: #a0a0a0;
        }

        @media (max-width: 768px) {
            .header-info-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filters {
                width: 100%;
            }

            .select-input {
                flex: 1;
                min-width: 120px;
            }

            .pagination-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .pagination-controls {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>
    <div class="gradient-overlay"></div>

    <div class="container">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo">🔧 Repair Hub</div>
        </nav>

        <!-- Dashboard Section -->
        <section class="dashboard-section">
            
            <!-- Top Header Banner (Date Today, Week Selector, Date Range) -->
            <div class="header-info-card">
                <div class="header-info-item">
                    <span class="header-info-label">Date Today</span>
                    <span class="header-info-value" id="header-date-today">--</span>
                </div>
                <div class="header-info-item">
                    <span class="header-info-label">Week Number</span>
                    <select class="header-info-select" id="week-select">
                        <option value="">All Weeks</option>
                    </select>
                </div>
                <div class="header-info-item">
                    <span class="header-info-label">Week Duration</span>
                    <span class="header-info-value" id="header-week-range">--</span>
                </div>
            </div>

            <!-- Statistics -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="stat-total">0</div>
                    <div class="stat-label">Total Repairs</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="stat-done">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="stat-notdone">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="stat-locations">0</div>
                    <div class="stat-label">Locations</div>
                </div>
            </div>

            <!-- Repairs Table Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Weekly Repair Plan</div>
                    <div class="filters">
                        <!-- Lower Week Filter Removed to Avoid Redundancy -->
                        <select class="select-input" id="location-filter">
                            <option value="">All Locations</option>
                        </select>
                        <select class="select-input" id="status-filter">
                            <option value="">All Status</option>
                        </select>
                        <button class="btn btn-reset" onclick="resetDisplay()">Reset</button>
                        <button class="btn" onclick="exportData()">Export CSV</button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table id="repair-table">
                        <thead>
                            <tr>
                                <th>Unit No</th>
                                <th>Repair Type</th>
                                <th>Duration</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Remarks</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="6" class="loading">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Controls -->
                <div class="pagination-container">
                    <div class="pagination-info" id="pagination-info">Showing 0 of 0 entries</div>
                    <div class="pagination-controls">
                        <button class="btn btn-reset" id="prev-btn" onclick="changePage(-1)" disabled>Previous</button>
                        <button class="btn" id="next-btn" onclick="changePage(1)" disabled>Next</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const DB_CONFIG = {
            API_URL: 'https://script.google.com/macros/s/AKfycbzs99Ftdsx8rPX10yVW_IUQ8rVP93OS8uDUisbmVp8grDlOaEVksW-sO14HprTeZQ/exec'
        };

        const COLUMN_MAP = {
            UNIT_NO: 0,
            WEEK: 1,
            DATE_START: 2,
            DATE_END: 3,
            REPAIR_TYPE: 4,
            LOCATION: 6,
            DURATION: 7,
            STATUS: 8,
            REMARKS: 9
        };

        let parsedDataList = [];
        let currentPage = 1;
        const PAGE_SIZE = 30;

        function formatDate(rawDate) {
            if (!rawDate) return '';
            const d = new Date(rawDate);
            if (isNaN(d.getTime())) return rawDate;
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' }).replace(/ /g, '-');
        }

        async function fetchFromSheets() {
            try {
                const response = await fetch(DB_CONFIG.API_URL);
                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const rawData = await response.json();
                
                const rows = rawData.length > 0 && String(rawData[0][0]).toLowerCase().includes('unit') 
                    ? rawData.slice(1) 
                    : rawData;

                return rows.map((row, index) => {
                    if (!row || row.length === 0 || !row[COLUMN_MAP.UNIT_NO]) return null;

                    return {
                        id: index,
                        unitNo: row[COLUMN_MAP.UNIT_NO] || '',
                        week: row[COLUMN_MAP.WEEK] || '',
                        dateStart: formatDate(row[COLUMN_MAP.DATE_START]),
                        dateEnd: formatDate(row[COLUMN_MAP.DATE_END]),
                        repairType: row[COLUMN_MAP.REPAIR_TYPE] || '',
                        duration: row[COLUMN_MAP.DURATION] || '',
                        location: row[COLUMN_MAP.LOCATION] || '',
                        status: row[COLUMN_MAP.STATUS] || 'NOT DONE',
                        remarks: row[COLUMN_MAP.REMARKS] || ''
                    };
                }).filter(Boolean);
            } catch (error) {
                console.error('Error loading data:', error);
                showError('❌ Error loading data. Check Web App URL deployment.');
                return [];
            }
        }

        function updateTopHeaderInfo() {
            // Set Today's Date
            const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' }).replace(/ /g, '-');
            document.getElementById('header-date-today').textContent = today;

            const selectedWeek = document.getElementById('week-select').value;
            
            if (parsedDataList.length > 0) {
                // Find matching row for week duration or fallback to first entry
                const match = selectedWeek 
                    ? parsedDataList.find(d => String(d.week) === String(selectedWeek))
                    : parsedDataList[0];

                if (match && match.dateStart && match.dateEnd) {
                    document.getElementById('header-week-range').textContent = `${match.dateStart} to ${match.dateEnd}`;
                } else {
                    document.getElementById('header-week-range').textContent = 'All Dates';
                }
            }
        }

        function getFilteredData() {
            const filters = getFilters();
            return parsedDataList.filter(item => {
                if (filters.week && String(item.week) !== String(filters.week)) return false;
                if (filters.location && item.location !== filters.location) return false;
                if (filters.status && item.status.toLowerCase() !== filters.status.toLowerCase()) return false;
                return true;
            });
        }

        function getFilters() {
            return {
                week: document.getElementById('week-select').value,
                location: document.getElementById('location-filter').value,
                status: document.getElementById('status-filter').value
            };
        }

        function resetDisplay() {
            document.getElementById('week-select').value = '';
            document.getElementById('location-filter').value = '';
            document.getElementById('status-filter').value = '';
            updateTopHeaderInfo();
            currentPage = 1;
            renderTable();
        }

        function changePage(direction) {
            const filtered = getFilteredData();
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderTable();
        }

        function updateStatus(id, newStatus) {
            const item = parsedDataList.find(d => d.id === id);
            if (item) {
                item.status = newStatus;
                updateStats(getFilteredData());
                const selectElem = document.getElementById(`status-select-${id}`);
                if (selectElem) {
                    const isDone = newStatus.toLowerCase() === 'done';
                    selectElem.className = `status-select ${isDone ? 'status-done' : 'status-notdone'}`;
                }
            }
        }

        function updateRemarks(id, newRemarks) {
            const item = parsedDataList.find(d => d.id === id);
            if (item) {
                item.remarks = newRemarks;
            }
        }

        function populateFilters() {
            const weeks = [...new Set(parsedDataList.map(r => r.week).filter(Boolean))].sort((a,b) => a - b);
            const locations = [...new Set(parsedDataList.map(r => r.location).filter(Boolean))];
            const statuses = [...new Set(parsedDataList.map(r => r.status).filter(Boolean))];

            populateSelect('week-select', weeks, 'Week ');
            populateSelect('location-filter', locations);
            populateSelect('status-filter', statuses);
        }

        function populateSelect(selectId, values, prefix = '') {
            const select = document.getElementById(selectId);
            values.forEach(val => {
                if (!select.querySelector(`option[value="${val}"]`)) {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = `${prefix}${val}`;
                    select.appendChild(opt);
                }
            });
        }

        function renderTable() {
            const filtered = getFilteredData();
            const tbody = document.getElementById('table-body');
            const totalItems = filtered.length;
            const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;

            if (currentPage > totalPages) currentPage = totalPages;

            const startIdx = (currentPage - 1) * PAGE_SIZE;
            const endIdx = Math.min(startIdx + PAGE_SIZE, totalItems);
            const pageData = filtered.slice(startIdx, endIdx);

            if (totalItems === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No repairs found matching your filters</td></tr>';
                document.getElementById('pagination-info').textContent = 'Showing 0 of 0 entries';
                document.getElementById('prev-btn').disabled = true;
                document.getElementById('next-btn').disabled = true;
                updateStats([]);
                return;
            }

            tbody.innerHTML = pageData.map(item => {
                const isDone = item.status.toLowerCase() === 'done';
                const statusClass = isDone ? 'status-done' : 'status-notdone';

                return `
                    <tr>
                        <td><strong>${item.unitNo}</strong></td>
                        <td>${item.repairType}</td>
                        <td>${item.duration}</td>
                        <td>${item.location}</td>
                        <td>
                            <select 
                                id="status-select-${item.id}"
                                class="status-select ${statusClass}" 
                                onchange="updateStatus(${item.id}, this.value)"
                            >
                                <option value="DONE" ${isDone ? 'selected' : ''}>DONE</option>
                                <option value="NOT DONE" ${!isDone ? 'selected' : ''}>NOT DONE</option>
                            </select>
                        </td>
                        <td>
                            <input 
                                type="text" 
                                class="remarks-input" 
                                value="${item.remarks}" 
                                placeholder="Add remarks..."
                                onchange="updateRemarks(${item.id}, this.value)"
                            />
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('pagination-info').textContent = `Showing ${startIdx + 1} to ${endIdx} of ${totalItems} entries (Page ${currentPage} of ${totalPages})`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages;

            updateStats(filtered);
        }

        function updateStats(filteredData) {
            const total = filteredData.length;
            const done = filteredData.filter(r => r.status.toLowerCase() === 'done').length;
            const notDone = filteredData.filter(r => r.status.toLowerCase() !== 'done').length;
            const locations = new Set(filteredData.map(r => r.location)).size;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-done').textContent = done;
            document.getElementById('stat-notdone').textContent = notDone;
            document.getElementById('stat-locations').textContent = locations;
        }

        function showError(message) {
            document.getElementById('table-body').innerHTML = `<tr><td colspan="6" class="empty-state">${message}</td></tr>`;
        }

        function exportData() {
            const filtered = getFilteredData();
            if (filtered.length === 0) return;

            const headers = ['Unit No', 'Repair Type', 'Duration', 'Location', 'Status', 'Remarks'];
            const csvContent = [
                headers.join(','),
                ...filtered.map(item => [
                    item.unitNo,
                    item.repairType,
                    item.duration,
                    item.location,
                    item.status,
                    item.remarks
                ].map(v => `"${v}"`).join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `weekly_repairs_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        async function init() {
            parsedDataList = await fetchFromSheets();

            if (parsedDataList.length > 0) {
                populateFilters();
                updateTopHeaderInfo();
                renderTable();

                document.getElementById('week-select').addEventListener('change', () => {
                    updateTopHeaderInfo();
                    currentPage = 1;
                    renderTable();
                });

                ['location-filter', 'status-filter'].forEach(id => {
                    document.getElementById(id).addEventListener('change', () => {
                        currentPage = 1;
                        renderTable();
                    });
                });
            } else {
                showError('No valid repair data found.');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
