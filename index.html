<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Management Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 150, 0.08) 25%, rgba(0, 255, 150, 0.08) 26%, transparent 27%, transparent 74%, rgba(0, 255, 150, 0.08) 75%, rgba(0, 255, 150, 0.08) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 150, 0.08) 25%, rgba(0, 255, 150, 0.08) 26%, transparent 27%, transparent 74%, rgba(0, 255, 150, 0.08) 75%, rgba(0, 255, 150, 0.08) 76%, transparent 77%, transparent);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 255, 150, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
        }

        .navbar {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 18px;
            font-weight: 700;
            color: #00ff96;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dashboard-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .card {
            background: rgba(20, 25, 50, 0.8);
            border: 1px solid rgba(0, 255, 150, 0.2);
            border-radius: 8px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
            padding-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .select-input {
            padding: 0.6rem 1rem;
            background: rgba(0, 255, 150, 0.1);
            border: 1px solid rgba(0, 255, 150, 0.3);
            border-radius: 4px;
            color: #00ff96;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .select-input:hover,
        .select-input:focus {
            border-color: #00ff96;
            box-shadow: 0 0 10px rgba(0, 255, 150, 0.2);
            outline: none;
        }

        .select-input option {
            background: #0a0e27;
            color: #00ff96;
        }

        .btn {
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, #00ff96, #00cc7a);
            border: none;
            color: #0a0e27;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            box-shadow: 0 0 20px rgba(0, 255, 150, 0.5);
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: rgba(0, 255, 150, 0.05);
            border: 1px solid rgba(0, 255, 150, 0.2);
            padding: 1.5rem;
            border-radius: 6px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #00ff96;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0a0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: rgba(0, 255, 150, 0.05);
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 700;
            color: #00ff96;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(0, 255, 150, 0.1);
            color: #a0a0a0;
        }

        tbody tr:hover {
            background: rgba(0, 255, 150, 0.05);
        }

        .status {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-done {
            background: rgba(0, 255, 150, 0.2);
            color: #00ff96;
            border: 1px solid rgba(0, 255, 150, 0.4);
        }

        .status-notdone {
            background: rgba(255, 180, 0, 0.2);
            color: #ffb400;
            border: 1px solid rgba(255, 180, 0, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #a0a0a0;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #a0a0a0;
        }

        @media (max-width: 768px) {
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filters {
                width: 100%;
            }

            .select-input {
                flex: 1;
                min-width: 120px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>
    <div class="gradient-overlay"></div>

    <div class="container">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo">🔧 Repair Hub</div>
        </nav>

        <!-- Dashboard Section -->
        <section class="dashboard-section">
            <!-- Statistics -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="stat-total">0</div>
                    <div class="stat-label">Total Repairs</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="stat-done">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="stat-notdone">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="stat-locations">0</div>
                    <div class="stat-label">Locations</div>
                </div>
            </div>

            <!-- Repairs Table Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Weekly Repairs</div>
                    <div class="filters">
                        <select class="select-input" id="week-filter">
                            <option value="">All Weeks</option>
                        </select>
                        <select class="select-input" id="location-filter">
                            <option value="">All Locations</option>
                        </select>
                        <select class="select-input" id="status-filter">
                            <option value="">All Status</option>
                        </select>
                        <button class="btn" onclick="exportData()">Export CSV</button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table id="repair-table">
                        <thead>
                            <tr>
                                <th>Unit No</th>
                                <th>Week</th>
                                <th>Date Start</th>
                                <th>Date End</th>
                                <th>Repair Type</th>
                                <th>Activity</th>
                                <th>Location</th>
                                <th>Duration</th>
                                <th>Status</th>
                                <th>Remarks</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="10" class="loading">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script>
        // ============================================
        // DATABASE CONFIGURATION
        // ============================================
        const DB_CONFIG = {
            API_URL: 'https://script.google.com/macros/s/AKfycbzs99Ftdsx8rPX10yVW_IUQ8rVP93OS8uDUisbmVp8grDlOaEVksW-sO14HprTeZQ/exec'
        };

        // Aligning columns to image sheet format:
        // Col A(0): UNIT NO | Col B(1): REPAIR TYPE | Col C(2): DURATION
        // Col D(3): LOCATION | Col E(4): STATUS | Col F(5): REMARKS
        const COLUMN_MAP = {
            UNIT_NO: 0,
            REPAIR_TYPE: 1,
            DURATION: 2,
            LOCATION: 3,
            STATUS: 4,
            REMARKS: 5
        };

        let globalMetaData = { week: '', dateStart: '', dateEnd: '' };
        let globalRows = [];

        // ============================================
        // FETCH DATA
        // ============================================
        async function fetchFromSheets() {
            try {
                const response = await fetch(DB_CONFIG.API_URL);
                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const rawData = await response.json();
                
                // Extract metadata from header block in sheet
                if (rawData.length >= 2) {
                    globalMetaData.week = rawData[1]?.[1] || '';      // Row 2, Col B (Week Number)
                    globalMetaData.dateStart = rawData[1]?.[2] || ''; // Row 2, Col C (Start Date)
                    globalMetaData.dateEnd = rawData[1]?.[3] || '';   // Row 2, Col D (End Date)
                }

                // Table data starts at Row 5 (index 4)
                return rawData.length > 4 ? rawData.slice(4) : [];
            } catch (error) {
                console.error('Error loading data:', error);
                showError('❌ Error loading data. Ensure Google Apps Script Web App is deployed as "Anyone".');
                return [];
            }
        }

        // ============================================
        // PARSE & FILTER
        // ============================================
        function parseRow(row) {
            if (!row || row.length === 0 || !row[COLUMN_MAP.UNIT_NO]) return null;

            return {
                unitNo: row[COLUMN_MAP.UNIT_NO] || '',
                week: globalMetaData.week,
                dateStart: globalMetaData.dateStart,
                dateEnd: globalMetaData.dateEnd,
                repairType: row[COLUMN_MAP.REPAIR_TYPE] || '',
                activity: row[COLUMN_MAP.REPAIR_TYPE] || '',
                location: row[COLUMN_MAP.LOCATION] || '',
                duration: row[COLUMN_MAP.DURATION] || '',
                status: row[COLUMN_MAP.STATUS] || '',
                remarks: row[COLUMN_MAP.REMARKS] || ''
            };
        }

        function filterRows(rows, filters = {}) {
            return rows.map(parseRow).filter(parsed => {
                if (!parsed) return false;
                if (filters.week && String(parsed.week) !== String(filters.week)) return false;
                if (filters.location && parsed.location !== filters.location) return false;
                if (filters.status && parsed.status.toLowerCase() !== filters.status.toLowerCase()) return false;
                return true;
            });
        }

        // ============================================
        // UI & RENDER FUNCTIONS
        // ============================================
        function populateFilters(parsedRows) {
            const weeks = [...new Set(parsedRows.map(r => r.week).filter(Boolean))];
            const locations = [...new Set(parsedRows.map(r => r.location).filter(Boolean))];
            const statuses = [...new Set(parsedRows.map(r => r.status).filter(Boolean))];

            populateSelect('week-filter', weeks);
            populateSelect('location-filter', locations);
            populateSelect('status-filter', statuses);
        }

        function populateSelect(selectId, values) {
            const select = document.getElementById(selectId);
            values.forEach(val => {
                if (!select.querySelector(`option[value="${val}"]`)) {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = val;
                    select.appendChild(opt);
                }
            });
        }

        function getFilters() {
            return {
                week: document.getElementById('week-filter').value,
                location: document.getElementById('location-filter').value,
                status: document.getElementById('status-filter').value
            };
        }

        function renderTable(rows, filters = {}) {
            const filtered = filterRows(rows, filters);
            const tbody = document.getElementById('table-body');

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty-state">No repairs found matching your filters</td></tr>';
                updateStats([]);
                return;
            }

            tbody.innerHTML = filtered.map(parsed => {
                const isDone = parsed.status.toLowerCase() === 'done';
                const statusClass = isDone ? 'status-done' : 'status-notdone';
                return `
                    <tr>
                        <td>${parsed.unitNo}</td>
                        <td>${parsed.week}</td>
                        <td>${parsed.dateStart}</td>
                        <td>${parsed.dateEnd}</td>
                        <td>${parsed.repairType}</td>
                        <td>${parsed.activity}</td>
                        <td>${parsed.location}</td>
                        <td>${parsed.duration}</td>
                        <td><span class="status ${statusClass}">${parsed.status}</span></td>
                        <td>${parsed.remarks}</td>
                    </tr>
                `;
            }).join('');

            updateStats(filtered);
        }

        function updateStats(parsedRows) {
            const total = parsedRows.length;
            const done = parsedRows.filter(r => r.status.toLowerCase() === 'done').length;
            const notDone = parsedRows.filter(r => r.status.toLowerCase() !== 'done').length;
            const locations = new Set(parsedRows.map(r => r.location)).size;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-done').textContent = done;
            document.getElementById('stat-notdone').textContent = notDone;
            document.getElementById('stat-locations').textContent = locations;
        }

        function showError(message) {
            document.getElementById('table-body').innerHTML = `<tr><td colspan="10" class="empty-state">${message}</td></tr>`;
        }

        // ============================================
        // EXPORT TO CSV
        // ============================================
        function exportData() {
            const filtered = filterRows(globalRows, getFilters());
            if (filtered.length === 0) return;

            const headers = ['Unit No', 'Week', 'Date Start', 'Date End', 'Repair Type', 'Activity', 'Location', 'Duration', 'Status', 'Remarks'];
            const csvContent = [
                headers.join(','),
                ...filtered.map(parsed => [
                    parsed.unitNo,
                    parsed.week,
                    parsed.dateStart,
                    parsed.dateEnd,
                    parsed.repairType,
                    parsed.activity,
                    parsed.location,
                    parsed.duration,
                    parsed.status,
                    parsed.remarks
                ].map(v => `"${v}"`).join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `repairs_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // ============================================
        // INITIALIZE
        // ============================================
        async function init() {
            globalRows = await fetchFromSheets();
            const parsedRows = globalRows.map(parseRow).filter(Boolean);

            if (parsedRows.length > 0) {
                populateFilters(parsedRows);
                renderTable(globalRows);

                ['week-filter', 'location-filter', 'status-filter'].forEach(id => {
                    document.getElementById(id).addEventListener('change', () => {
                        renderTable(globalRows, getFilters());
                    });
                });
            } else {
                showError('No valid repair data found.');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
