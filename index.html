<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 150, 0.08) 25%, rgba(0, 255, 150, 0.08) 26%, transparent 27%, transparent 74%, rgba(0, 255, 150, 0.08) 75%, rgba(0, 255, 150, 0.08) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 150, 0.08) 25%, rgba(0, 255, 150, 0.08) 26%, transparent 27%, transparent 74%, rgba(0, 255, 150, 0.08) 75%, rgba(0, 255, 150, 0.08) 76%, transparent 77%, transparent);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 255, 150, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
        }

        .navbar {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 20px;
            font-weight: 700;
            color: #00ff96;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo::before {
            content: '';
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #00ff96, #00cc7a);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 50%, 0 100%);
        }

        .dashboard-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .sidebar {
            background: rgba(20, 25, 50, 0.8);
            border: 1px solid rgba(0, 255, 150, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .sidebar-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ff96;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .sidebar-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            background: rgba(0, 255, 150, 0.1);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            color: #a0a0a0;
            border-left: 3px solid transparent;
        }

        .sidebar-item:hover {
            background: rgba(0, 255, 150, 0.2);
            border-left-color: #00ff96;
            color: #00ff96;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .card {
            background: rgba(20, 25, 50, 0.8);
            border: 1px solid rgba(0, 255, 150, 0.2);
            border-radius: 8px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .card:hover {
            border-color: rgba(0, 255, 150, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 150, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
            padding-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .select-input {
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 150, 0.1);
            border: 1px solid rgba(0, 255, 150, 0.3);
            border-radius: 4px;
            color: #00ff96;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .select-input:hover,
        .select-input:focus {
            border-color: #00ff96;
            box-shadow: 0 0 10px rgba(0, 255, 150, 0.2);
            outline: none;
        }

        .select-input option {
            background: #0a0e27;
            color: #00ff96;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: rgba(0, 255, 150, 0.05);
            border: 1px solid rgba(0, 255, 150, 0.2);
            padding: 1.5rem;
            border-radius: 6px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #00ff96;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0a0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: rgba(0, 255, 150, 0.05);
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 700;
            color: #00ff96;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(0, 255, 150, 0.1);
            color: #a0a0a0;
        }

        tbody tr:hover {
            background: rgba(0, 255, 150, 0.05);
        }

        .status {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-done {
            background: rgba(0, 255, 150, 0.2);
            color: #00ff96;
            border: 1px solid rgba(0, 255, 150, 0.4);
        }

        .status-notdone {
            background: rgba(255, 180, 0, 0.2);
            color: #ffb400;
            border: 1px solid rgba(255, 180, 0, 0.4);
        }

        .btn-export {
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, #00ff96, #00cc7a);
            border: none;
            color: #0a0e27;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-export:hover {
            box-shadow: 0 0 20px rgba(0, 255, 150, 0.5);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #a0a0a0;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #a0a0a0;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filters {
                width: 100%;
            }

            .select-input {
                flex: 1;
                min-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>
    <div class="gradient-overlay"></div>

    <div class="container">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo">Repair Hub</div>
        </nav>

        <!-- Dashboard Section -->
        <section class="dashboard-section">
            <div class="dashboard-grid">
                <!-- Sidebar -->
                <div class="sidebar">
                    <div class="sidebar-title">Quick Stats</div>
                    <div style="display: grid; grid-template-columns: 1fr; gap: 0.5rem;">
                        <div style="padding: 0.75rem; background: rgba(0, 255, 150, 0.1); border-radius: 4px;">
                            <div style="font-size: 20px; font-weight: 700; color: #00ff96;" id="quick-total">0</div>
                            <div style="font-size: 11px; color: #a0a0a0; margin-top: 0.5rem;">Total</div>
                        </div>
                        <div style="padding: 0.75rem; background: rgba(0, 255, 150, 0.1); border-radius: 4px;">
                            <div style="font-size: 20px; font-weight: 700; color: #00ff96;" id="quick-done">0</div>
                            <div style="font-size: 11px; color: #a0a0a0; margin-top: 0.5rem;">Completed</div>
                        </div>
                        <div style="padding: 0.75rem; background: rgba(255, 180, 0, 0.1); border-radius: 4px;">
                            <div style="font-size: 20px; font-weight: 700; color: #ffb400;" id="quick-notdone">0</div>
                            <div style="font-size: 11px; color: #a0a0a0; margin-top: 0.5rem;">Pending</div>
                        </div>
                    </div>
                </div>

                <!-- Main Content -->
                <div>
                    <!-- Repairs Table Card -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Weekly Repairs</div>
                            <div class="filters">
                                <select class="select-input" id="week-filter">
                                    <option value="">All Weeks</option>
                                </select>
                                <select class="select-input" id="location-filter">
                                    <option value="">All Locations</option>
                                </select>
                                <select class="select-input" id="status-filter">
                                    <option value="">All Status</option>
                                </select>
                                <button class="btn-export" onclick="exportCurrentData()">Export CSV</button>
                            </div>
                        </div>

                        <div class="table-wrapper">
                            <table id="repair-table">
                                <thead>
                                    <tr>
                                        <th>Unit No</th>
                                        <th>Week</th>
                                        <th>Date Start</th>
                                        <th>Date End</th>
                                        <th>Repair Type</th>
                                        <th>Activity</th>
                                        <th>Location</th>
                                        <th>Duration</th>
                                        <th>Status</th>
                                        <th>Remarks</th>
                                    </tr>
                                </thead>
                                <tbody id="table-body">
                                    <tr><td colspan="10" class="loading">Loading data...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // ============================================
        // DATABASE CONFIGURATION
        // ============================================
        const DB_CONFIG = {
            SHEET_ID: 'YOUR_SHEET_ID',
            API_KEY: 'YOUR_API_KEY',
            SHEET_NAME: 'Sheet1'
        };

        const COLUMN_MAP = {
            UNIT_NO: 0,
            WEEK: 1,
            DATE_START: 2,
            DATE_END: 3,
            REPAIR_TYPE: 4,
            ACTIVITY: 5,
            LOCATION: 7,
            DURATION: 8,
            STATUS: 9,
            REMARKS: 10
        };

        // ============================================
        // FETCH & PARSE
        // ============================================
        async function fetchFromSheets() {
            try {
                if (DB_CONFIG.SHEET_ID === 'weekly_repair_db' || DB_CONFIG.API_KEY === 'https://script.google.com/macros/s/AKfycbzgmUojaS5IHh_3UsZPUz4Lj7lrMLBU9vzhcnqtmRNbXiNlt77a7n0w2T4gZx9F5fgSvw/exec') {
                    document.getElementById('table-body').innerHTML = 
                        '<tr><td colspan="10" class="empty-state">⚠️ Please configure SHEET_ID and API_KEY in the code</td></tr>';
                    return [];
                }

                const url = `https://sheets.googleapis.com/v4/spreadsheets/${DB_CONFIG.SHEET_ID}/values/${DB_CONFIG.SHEET_NAME}?key=${DB_CONFIG.API_KEY}`;
                const response = await fetch(url);

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const data = await response.json();
                return data.values || [];
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('table-body').innerHTML = 
                    '<tr><td colspan="10" class="empty-state">❌ Error loading data</td></tr>';
                return [];
            }
        }

        function parseRow(row) {
            if (!row || row.length < 11) return null;

            return {
                unitNo: row[COLUMN_MAP.UNIT_NO] || '',
                week: row[COLUMN_MAP.WEEK] || '',
                dateStart: row[COLUMN_MAP.DATE_START] || '',
                dateEnd: row[COLUMN_MAP.DATE_END] || '',
                repairType: row[COLUMN_MAP.REPAIR_TYPE] || '',
                activity: row[COLUMN_MAP.ACTIVITY] || '',
                location: row[COLUMN_MAP.LOCATION] || '',
                duration: row[COLUMN_MAP.DURATION] || '',
                status: row[COLUMN_MAP.STATUS] || '',
                remarks: row[COLUMN_MAP.REMARKS] || ''
            };
        }

        // ============================================
        // FILTER & SORT
        // ============================================
        function filterRows(rows, filters = {}) {
            let filtered = rows;

            if (filters.week) {
                filtered = filtered.filter(row => {
                    const parsed = parseRow(row);
                    return parsed && parsed.week == filters.week;
                });
            }

            if (filters.location) {
                filtered = filtered.filter(row => {
                    const parsed = parseRow(row);
                    return parsed && parsed.location === filters.location;
                });
            }

            if (filters.status) {
                filtered = filtered.filter(row => {
                    const parsed = parseRow(row);
                    return parsed && parsed.status === filters.status;
                });
            }

            return filtered;
        }

        function getUniqueValues(rows, columnMap) {
            const values = new Set();
            rows.forEach(row => {
                const parsed = parseRow(row);
                if (parsed && parsed[columnMap]) {
                    values.add(parsed[columnMap]);
                }
            });
            return Array.from(values).sort();
        }

        // ============================================
        // UI FUNCTIONS
        // ============================================
        function populateFilters(rows) {
            const weeks = getUniqueValues(rows, 'week');
            const locations = getUniqueValues(rows, 'location');
            const statuses = getUniqueValues(rows, 'status');

            populateSelect('week-filter', weeks);
            populateSelect('location-filter', locations);
            populateSelect('status-filter', statuses);
        }

        function populateSelect(selectId, values) {
            const select = document.getElementById(selectId);
            const currentValue = select.value;

            values.forEach(value => {
                if (!select.querySelector(`option[value="${value}"]`)) {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = value;
                    select.appendChild(option);
                }
            });

            select.value = currentValue;
        }

        function renderTable(rows, filters = {}) {
            const filtered = filterRows(rows, filters);
            const tbody = document.getElementById('table-body');

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty-state">No repairs found matching your filters</td></tr>';
                updateStats(rows, filters);
                return;
            }

            const html = filtered.map(row => {
                const parsed = parseRow(row);
                if (!parsed) return '';

                const statusClass = parsed.status.toLowerCase() === 'done' ? 'status-done' : 'status-notdone';
                return `
                    <tr>
                        <td>${parsed.unitNo}</td>
                        <td>${parsed.week}</td>
                        <td>${parsed.dateStart}</td>
                        <td>${parsed.dateEnd}</td>
                        <td>${parsed.repairType}</td>
                        <td>${parsed.activity}</td>
                        <td>${parsed.location}</td>
                        <td>${parsed.duration}</td>
                        <td><span class="status ${statusClass}">${parsed.status}</span></td>
                        <td>${parsed.remarks}</td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = html;
            updateStats(rows, filters);
        }

        function updateStats(allRows, filters = {}) {
            const filtered = filterRows(allRows.slice(1), filters);
            const parsed = filtered.map(parseRow).filter(Boolean);

            const total = parsed.length;
            const done = parsed.filter(r => r.status.toLowerCase() === 'done').length;
            const notDone = parsed.filter(r => r.status.toLowerCase() === 'not done').length;

            document.getElementById('quick-total').textContent = total;
            document.getElementById('quick-done').textContent = done;
            document.getElementById('quick-notdone').textContent = notDone;
        }

        function getFilters() {
            return {
                week: document.getElementById('week-filter').value,
                location: document.getElementById('location-filter').value,
                status: document.getElementById('status-filter').value
            };
        }

        function exportCurrentData() {
            const rows = globalRows;
            const filters = getFilters();
            const filtered = filterRows(rows.slice(1), filters);

            const headers = ['Unit No', 'Week', 'Date Start', 'Date End', 'Repair Type', 'Activity', 'Location', 'Duration', 'Status', 'Remarks'];
            const csvContent = [
                headers.join(','),
                ...filtered.map(row => {
                    const parsed = parseRow(row);
                    if (!parsed) return '';
                    return [
                        parsed.unitNo,
                        parsed.week,
                        parsed.dateStart,
                        parsed.dateEnd,
                        parsed.repairType,
                        parsed.activity,
                        parsed.location,
                        parsed.duration,
                        parsed.status,
                        parsed.remarks
                    ].map(v => `"${v}"`).join(',');
                })
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `repairs_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // ============================================
        // INITIALIZE
        // ============================================
        let globalRows = [];

        async function init() {
            globalRows = await fetchFromSheets();

            if (globalRows.length > 1) {
                populateFilters(globalRows.slice(1));
                renderTable(globalRows.slice(1));

                // Add filter listeners
                document.getElementById('week-filter').addEventListener('change', () => {
                    renderTable(globalRows.slice(1), getFilters());
                });

                document.getElementById('location-filter').addEventListener('change', () => {
                    renderTable(globalRows.slice(1), getFilters());
                });

                document.getElementById('status-filter').addEventListener('change', () => {
                    renderTable(globalRows.slice(1), getFilters());
                });
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
